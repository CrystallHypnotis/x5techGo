basePath: /
definitions:
  handler.errorResponse:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  order.CreateOrderInput:
    properties:
      items:
        items:
          $ref: '#/definitions/order.Item'
        type: array
    type: object
  order.Item:
    properties:
      name:
        type: string
      price:
        type: integer
      quantity:
        type: integer
    type: object
  order.Order:
    properties:
      created_at:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/order.Item'
        type: array
      status:
        $ref: '#/definitions/order.Status'
      total_price:
        type: integer
    type: object
  order.Status:
    enum:
    - new
    - processing
    - completed
    - cancelled
    type: string
    x-enum-varnames:
    - StatusNew
    - StatusProcessing
    - StatusCompleted
    - StatusCancelled
  order.StatusChange:
    properties:
      changed_at:
        type: string
      status:
        $ref: '#/definitions/order.Status'
    type: object
  order.UpdateStatusInput:
    properties:
      status:
        $ref: '#/definitions/order.Status'
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend сервиса для создания, ведения и обработки заказов
  title: Order Service
  version: "1.0"
paths:
  /api/v1/orders:
    get:
      description: Возвращает все заказы в repository
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/order.Order'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Получение списка заказов
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Принимает список товаров, валидирует их, после передаёт данные
        в repository
      parameters:
      - description: Товары в заказе
        in: body
        name: items
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Создание заказа в сервисе
      tags:
      - orders
  /api/v1/orders/{id}:
    get:
      description: Возвращает заказ по его ID
      parameters:
      - description: ID заказа
        format: int64
        in: path
        name: ID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Получение заказа
      tags:
      - orders
  /api/v1/orders/{id}/history:
    get:
      description: Возвращает историю изменения статусов заказа с временными метками
      parameters:
      - description: ID заказа
        format: int64
        in: path
        name: ID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/order.StatusChange'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Получение истории статусов заказа
      tags:
      - orders
  /api/v1/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Измененяет статус заказа по ID с валидацией допустимости транзита
        статуса
      parameters:
      - description: ID заказа
        format: int64
        in: path
        name: ID
        required: true
        type: integer
      - description: Новый статус
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/order.UpdateStatusInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Изменение статуса заказа
      tags:
      - orders
  /health:
    get:
      description: Возвращает статус сервиса
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверка статуса сервиса
      tags:
      - health
swagger: "2.0"
